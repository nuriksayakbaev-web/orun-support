<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORUN Support — Поддержка пользователей</title>
  <meta name="description" content="Помощь, вопросы по поездкам и связь с командой ORUN — в одном месте">
  <meta name="theme-color" content="#211813">
  <link rel="canonical" href="https://nuriksayakbaev.github.io/orun-support/">

  <!-- Open Graph. Адреса должны совпадать с публичным URL GitHub Pages (см. README). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ORUN">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="ORUN Support — Поддержка пользователей">
  <meta property="og:description" content="Помощь, вопросы по поездкам и связь с командой ORUN — в одном месте">
  <meta property="og:url" content="https://nuriksayakbaev.github.io/orun-support/">
  <meta property="og:image" content="https://nuriksayakbaev.github.io/orun-support/assets/orun-support-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Логотип ORUN">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ORUN Support — Поддержка пользователей">
  <meta name="twitter:description" content="Помощь, вопросы по поездкам и связь с командой ORUN — в одном месте">
  <meta name="twitter:image" content="https://nuriksayakbaev.github.io/orun-support/assets/orun-support-preview.png">
  <meta name="twitter:image:alt" content="Логотип ORUN">

  <style>
    :root { --bg: #211813; --text: #f5f3ef; --muted: #b9aea4; --orange: #e05f26; --orange-hover: #f06f34; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(ellipse at 70% 30%, #2b2a1c 0%, var(--bg) 60%);
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 640px; text-align: center; }
    .banner { width: 100%; height: auto; border-radius: 20px; display: block; margin: 0 auto 32px; }
    h1 { font-size: clamp(26px, 6vw, 38px); line-height: 1.15; margin: 0 0 14px; }
    p { color: var(--muted); font-size: clamp(16px, 4vw, 19px); margin: 0 auto 32px; max-width: 34em; }
    .btn {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 14px;
      transition: background .15s;
    }
    .btn:hover, .btn:focus-visible { background: var(--orange-hover); }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img class="banner" src="assets/orun-support-preview.png" width="1200" height="630" alt="Логотип ORUN">
    <h1>ORUN Support — Поддержка пользователей</h1>
    <p>Помощь, вопросы по поездкам и связь с командой ORUN — в одном месте</p>
    <a class="btn" href="https://t.me/OrunSupportBot" rel="noopener">Открыть Telegram</a>
  </main>
</body>
</html>
